[project]
name = "codesentinel"
version = "2.0.0"
description = "AI-powered GitHub Pull Request code reviewer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-projects",
    "azure-identity",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob",
    "fastapi",
    "openai",
    "openai-agents>=0.22.2",
    "pydantic",
    "pyjwt",
    "python-dotenv",
    "requests",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesentinel"]
