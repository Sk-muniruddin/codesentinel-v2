[project]
name = "codesentinel"
version = "2.0.0"
description = "AI-powered GitHub Pull Request code reviewer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-projects",
    "azure-identity",
    "azure-storage-blob",
    "fastapi",
    "openai",
    "pydantic",
    "pyjwt",
    "python-dotenv",
    "requests",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]